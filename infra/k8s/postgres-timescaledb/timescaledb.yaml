# Dev-scale TimescaleDB: single replica, no HA/backups. The init.sql content
# below must stay in sync with infra/sql/init.sql (used by docker-compose.dev.yml
# for local dev without a cluster) — same schema, two delivery mechanisms.
apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-init
  namespace: hypertrace
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS timescaledb;

    CREATE TABLE IF NOT EXISTS raw_metrics (
        time                      TIMESTAMPTZ NOT NULL,
        cluster                   TEXT NOT NULL,
        namespace                 TEXT NOT NULL,
        node                      TEXT NOT NULL,
        pod                       TEXT,
        container                 TEXT,
        service                   TEXT,
        cpu_usage_cores           DOUBLE PRECISION,
        memory_working_set_bytes  BIGINT,
        network_rx_bytes_total    BIGINT,
        network_tx_bytes_total    BIGINT,
        disk_read_bytes_total     BIGINT,
        disk_write_bytes_total    BIGINT
    );
    SELECT create_hypertable('raw_metrics', 'time', if_not_exists => TRUE);

    CREATE TABLE IF NOT EXISTS cost_events (
        time                    TIMESTAMPTZ NOT NULL,
        service                 TEXT NOT NULL,
        resource_type           TEXT NOT NULL,
        unit_rate               DOUBLE PRECISION NOT NULL,
        cost_per_hour           DOUBLE PRECISION NOT NULL,
        cost_per_unit_of_work   DOUBLE PRECISION
    );
    SELECT create_hypertable('cost_events', 'time', if_not_exists => TRUE);

    CREATE TABLE IF NOT EXISTS baselines (
        service               TEXT NOT NULL,
        metric                TEXT NOT NULL,
        rolling_mean          DOUBLE PRECISION NOT NULL,
        rolling_stddev        DOUBLE PRECISION NOT NULL,
        day_of_week_profile   JSONB NOT NULL DEFAULT '{}',
        updated_at            TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (service, metric)
    );

    CREATE TABLE IF NOT EXISTS anomalies (
        id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        service         TEXT NOT NULL,
        score           DOUBLE PRECISION NOT NULL,
        classification  TEXT NOT NULL DEFAULT 'unclassified',
        evidence        JSONB NOT NULL DEFAULT '{}',
        status          TEXT NOT NULL DEFAULT 'open',
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS policies (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        org_id      TEXT NOT NULL,
        rule_dsl    JSONB NOT NULL,
        scope       TEXT NOT NULL,
        action      TEXT NOT NULL,
        priority    INTEGER NOT NULL DEFAULT 0
    );

    CREATE TABLE IF NOT EXISTS actions_log (
        id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        anomaly_id      UUID REFERENCES anomalies (id),
        action_type     TEXT NOT NULL,
        executed_at     TIMESTAMPTZ NOT NULL DEFAULT now(),
        result          TEXT NOT NULL,
        rollback_ref    TEXT
    );
---
apiVersion: v1
kind: Secret
metadata:
  name: timescaledb-credentials
  namespace: hypertrace
type: Opaque
stringData:
  POSTGRES_USER: hypertrace
  POSTGRES_PASSWORD: hypertrace-dev
  POSTGRES_DB: hypertrace
  PGDATA: /var/lib/postgresql/data/pgdata
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: hypertrace
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:2.15.3-pg16
          envFrom:
            - secretRef:
                name: timescaledb-credentials
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: timescaledb-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: hypertrace
spec:
  selector:
    app: timescaledb
  ports:
    - port: 5432
      targetPort: 5432
