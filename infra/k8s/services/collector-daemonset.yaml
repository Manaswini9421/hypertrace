apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collector
  namespace: hypertrace
spec:
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      serviceAccountName: collector
      # Kubernetes otherwise injects <SVCNAME>_PORT etc. Docker-links-style env
      # vars for every Service in the namespace (e.g. RABBITMQ_PORT=tcp://...),
      # which collides with our own RABBITMQ_*/DATABASE_* config prefixes.
      # Every future service manifest needs this too, for the same reason.
      enableServiceLinks: false
      containers:
        - name: collector
          image: hypertrace/collector:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              value: kind-hypertrace
            - name: RABBITMQ_HOST
              value: rabbitmq.hypertrace.svc.cluster.local
            - name: RABBITMQ_USER
              value: hypertrace
            - name: RABBITMQ_PASSWORD
              value: hypertrace-dev
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
