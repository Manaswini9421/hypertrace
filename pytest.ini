[pytest]
testpaths = tests
markers =
    slow: drives the live pipeline and waits on real 10s-scale timing

# Unit tests (tests/*.py) stub their infrastructure and always run.
# Integration tests (tests/integration/) need RabbitMQ, TimescaleDB and the
# api-bff reachable on localhost and skip themselves otherwise — see
# tests/integration/conftest.py, or run `make integration` which sets up the
# port-forwards for you.
#
#   pytest -q                    everything available
#   pytest tests -q -m "not slow"  skip the slowest end-to-end cases
#   pytest tests/integration -q    integration only
